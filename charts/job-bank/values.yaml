frontend:
  name: job-bank
  replicaCount: 1
  image:
    repository: mfe-pot-job-bank
    tag: latest
    pullPolicy: IfNotPresent
  containerPort: 80
  servicePort: 80
  # Same-origin: the BFF is exposed under this same hostname via the /api
  # Ingress path rule below, not a separate hostname -- see CLAUDE.md's
  # Hosting section on why (reduces the real hostname count, makes this
  # call same-origin). Matches apps/job-bank/src/runtime-config.ts's shape.
  # Empty, not "/api": HttpJobBankApiClient already appends "/api/..."
  # itself (`${baseUrl}/api/jobs`), so this value is just "this app's own
  # origin" -- shared-runtime-config's fetchRuntimeConfig resolves "" to
  # that origin. A literal "/api" here double-prefixes every request to
  # /api/api/... and 404s (a real bug, only ever exercised once the
  # runtime-config-over-federation fix started reaching a real BFF).
  # strapiBaseUrl is browser-to-server (ContentClient fetches Strapi
  # directly, same as shell's federation-manifest fetch) -- the real
  # public Ingress hostname from mfe-pot-platform's charts/strapi, not
  # in-cluster Service DNS.
  runtimeConfig:
    jobBankBffBaseUrl: ""
    strapiBaseUrl: "http://cms.mfe-pot.local"

backend:
  name: job-bank-bff
  replicaCount: 1
  image:
    repository: mfe-pot-job-bank-bff
    tag: latest
    pullPolicy: IfNotPresent
  containerPort: 3001
  servicePort: 3001
  env:
    HOST: "0.0.0.0"
    PORT: "3001"

ingress:
  host: job-bank.mfe-pot.local
  className: nginx
