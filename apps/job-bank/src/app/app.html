  @if (intro(); as content) {
    <section>
      <h1>{{ content.title }}</h1>
      <p>{{ content.body }}</p>
    </section>
  } @else if (introLoadError()) {

} @else {
  <p role="alert">{{ 'auth.signInRequired' | transloco }}</p>
}
